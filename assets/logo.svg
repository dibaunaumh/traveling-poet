<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The app logo: the same nib as the home-screen icon (assets/icon.svg),
       drawn larger and on plain paper, because a logo is shown small (the
       Google consent screen shows it at 120 px) where the icon's ruled lines
       and margin turn to noise. Render: qlmanage -t -s 1024 -o <dir>
       assets/logo.svg, then sips -z N N into priv/static/images/logo-N.png. -->
  <rect width="1024" height="1024" fill="#fdf8ec"/>
  <g transform="translate(512 532) rotate(-28) scale(1.22) translate(-512 -540)" fill="#3a3226">
    <!-- nib -->
    <path d="M512 850 C 400 700, 330 560, 330 430 C 330 310, 410 230, 512 230 C 614 230, 694 310, 694 430 C 694 560, 624 700, 512 850 Z"/>
    <!-- slit and breather hole, cut out in paper colour -->
    <rect x="503" y="500" width="18" height="330" rx="9" fill="#fdf8ec"/>
    <circle cx="512" cy="500" r="36" fill="#fdf8ec"/>
    <!-- collar -->
    <rect x="382" y="150" width="260" height="110" rx="34"/>
  </g>
</svg>
