# Dev Fly.io config for traveling-poet-dev (poet org, slug poet-217).
# Deploy with: ./deploy.sh dev   (first deploy: add --ha=false)
#
# PREREQUISITES before first deploy:
#   1. fly apps create traveling-poet-dev -o poet-217
#   2. fly volumes create traveling_poet_data -a traveling-poet-dev --size 1 --region sjc
#   3. fly secrets set -a traveling-poet-dev \
#        SECRET_KEY_BASE="$(mix phx.gen.secret)" \
#        PHOENIX_URL='https://traveling-poet-dev.fly.dev' \
#        GOOGLE_CLIENT_ID='<dev OAuth client id>' \
#        GOOGLE_CLIENT_SECRET='<dev OAuth client secret>' \
#        SPRITES_TOKEN='<sprites.dev token>' \
#        OPENROUTER_API_KEY='<openrouter key>' \
#        IMAGE_GEN_API_KEY='<google ai key for gemini image gen>' \
#        AWS_ACCESS_KEY_ID='<tigris>' AWS_SECRET_ACCESS_KEY='<tigris>' \
#        TELEGRAM_BOT_TOKEN='<bot token>' TELEGRAM_BOT_USERNAME='<bot username>' \
#        STRIPE_SECRET_KEY='<sk_live_…>' STRIPE_WEBHOOK_SECRET='<whsec_…>'
#   (leave the STRIPE_* pair unset to keep the mock checkout page)
#
#   The dev Google OAuth client needs redirect URI
#   https://traveling-poet-dev.fly.dev/auth/google/callback
#
# NOTE: single machine only — SQLite + the schedulers + the Telegram
# long-poller all assume one instance. Never scale this app horizontally.

app = 'traveling-poet-dev'
primary_region = 'sjc'
kill_signal = 'SIGTERM'

[build]

[env]
  DATABASE_PATH = '/mnt/data/traveling_poet.db'
  # Custom domain (certs added via `fly certs add poet.travel`); the
  # traveling-poet-dev.fly.dev hostname stays valid via check_origin.
  PHX_HOST = 'poet.travel'
  PORT = '8080'
  # Namespace sprite names so dev can't collide with a future prod on the
  # same sprites.dev account
  SPRITE_NAMESPACE = 'tpoetdev'
  # Bucket lives in the poet org; "traveling-poet-dev" was burned by a
  # create-then-move-org dance (Tigris cools down deleted names)
  TIGRIS_BUCKET_NAME = 'tpoet-dev-media'
  AWS_ENDPOINT_URL_S3 = 'https://fly.storage.tigris.dev'
  AWS_REGION = 'auto'
  # Daily journey scheduler tick (minutes); 0 disables
  JOURNEY_CHECK_INTERVAL_MINUTES = '30'
  # Feedback markers go to the poet once the reader has been quiet this long
  MARKER_DELIVERY_INTERVAL_MINUTES = '5'
  MARKER_QUIET_MINUTES = '15'
  DAILY_MARKER_REVISIONS_CAP = '4'
  DAILY_RUNS_CAP = '1'
  DAILY_CHAT_TURNS_CAP = '50'
  # 8, not 6: the daily entry illustration takes one, and the trip guide asks
  # for up to ~3 place drawings on top. At 6 the guide got at most five and
  # usually fewer. Roughly +$0.06/poet/day at $0.03 an image.
  DAILY_IMAGE_CAP = '12'
  # Change stream (webhook mirror). Idle until an endpoint is registered at
  # /admin/change-stream, so 30s polling costs nothing on a quiet app.
  CHANGE_STREAM_POLL_SECONDS = '30'
  CHANGE_STREAM_BATCH_SIZE = '100'
  CHANGE_STREAM_MAX_BATCH_WAIT_SECONDS = '60'
  CHANGE_STREAM_FAILURE_THRESHOLD = '5'

[[mounts]]
  source = 'traveling_poet_data'
  destination = '/mnt/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one machine running: the DailyJourneyScheduler tick and the Telegram
  # long-poller live in the app — with min 0 they silently never fire.
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
